<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transition</title>

    <style>
        div{
            background-color: orange;
            width: 200px;
            height: 150px;
            margin: 100px ;
            transition-property: width,heigth, background-color;
            transition-duration: .5s, 1s;
            transition-timing-function:cubic-bezier(.55,-0.28,.48,1.28);
            transition-delay: 0, 5s;
        }

        div:hover{
            width: 400px;
            height: 300px;
            background-color: red;
        }
    </style>
</head>
<body>
    
    <div></div>

</body>
</html>
