<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Font-Face</title>

    <style>

        @font-face{

            font-family:nadia;
            src: 
                local("Nadia Serif ")
                local("Nadia-Serif")
                url(./nadia/nadia-serif.ttf) format("truetype"),
                url(./nadia/nadia-serif.woff) format("woff"),
                url(./nadia/nadia-serif.svg) format("svg");
        }

    @font-face{
        font-family: 'chunkfiveregular';
        src: url(./ChunkRegular/chunkfive-regular-webfont.woff2) format('woff2'),
            url(./ChunkRegular/chunkfive-regular-webfont.woff) format('woff');
        font-weight: normal;
        font-style: normal;
}

        
        h1{
            font-family: chunkfiveregular,'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>
</head>
<body>
    
    <h1>Font-Face</h1>
    


</body>
</html>
